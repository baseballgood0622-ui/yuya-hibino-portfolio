    <!-- 中央：爽やかなショートヘア青年のミニマル線画（帽子・メガネなし） -->
    <!-- 肩・ジャケット -->
    <path d="M160 560 C190 480 250 450 350 450 C450 450 510 480 540 560" stroke-width="5"/>
    <path d="M275 452 L310 535 L350 500 L390 535 L425 452" stroke-width="4"/>
