    <path d="M236 285 C224 215 268 150 350 148 C432 150 476 215 464 285 C452 245 424 225 398 242 C382 215 356 212 335 245 C318 218 288 224 270 250 C255 238 242 256 236 285 Z" stroke-width="5"/>
    <path d="M285 182 Q340 164 395 180" stroke-width="3.5"/>

    <!-- 眉・目・鼻・笑顔 -->
    <path d="M278 272 Q300 260 320 268" stroke-width="4.5"/>
    <path d="M380 268 Q400 260 422 272" stroke-width="4.5"/>
    <circle cx="300" cy="298" r="7" fill="#1e3a5f"/>
    <circle cx="400" cy="298" r="7" fill="#1e3a5f"/>
